# deploy-windows/nginx/nginx.conf
# Windows nginx reverse-proxy: kb.tradesoft.corp -> 127.0.0.1:8055
# Положи этот файл в C:\nginx\conf\nginx.conf (заменив дефолтный).
# Сертификаты положи в C:\nginx\conf\certs\ (kb.tradesoft.corp.crt/.key).

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # HTTP -> HTTPS и reverse-proxy на eval_server
    server {
        listen       80;
        server_name  kb.tradesoft.corp;
        return 301 https://$host$request_uri;
    }

    server {
        listen       443 ssl;
        server_name  kb.tradesoft.corp;

        ssl_certificate     C:/nginx/conf/certs/kb.tradesoft.corp.crt;
        ssl_certificate_key C:/nginx/conf/certs/kb.tradesoft.corp.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:1m;
        ssl_session_timeout 5m;

        location / {
            proxy_pass         http://127.0.0.1:8055;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
        }
    }
}
