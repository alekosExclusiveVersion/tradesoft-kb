<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Search — Tradesoft</title>
<link rel="icon" href="data:,">
<style>
:root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --fg: #c9d1d9; --fg2: #8b949e; --fg3: #484f58;
    --accent: #58a6ff; --accent2: #1f6feb;
    --green: #3fb950; --yellow: #d29922; --red: #f85149;
    --border: #30363d; --radius: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: var(--bg); color: var(--fg); min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }

/* Header */
header { text-align: center; padding: 40px 0 20px; }
header h1 { font-size: 24px; color: var(--fg); font-weight: 600; }
header p { color: var(--fg2); margin-top: 8px; font-size: 14px; }

/* Search box */
.search-box { display: flex; gap: 8px; margin: 20px 0; }
.search-box input {
    flex: 1; padding: 12px 16px; font-size: 16px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--fg); outline: none;
}
.search-box input:focus { border-color: var(--accent); }
.search-box button {
    padding: 12px 24px; font-size: 16px; font-weight: 600;
    background: var(--accent2); color: #fff; border: none;
    border-radius: var(--radius); cursor: pointer;
}
.search-box button:hover { background: var(--accent); }

/* Intent badge */
.intent-badge {
    display: inline-block; padding: 4px 10px; font-size: 12px;
    border-radius: 12px; font-weight: 600; margin-bottom: 12px;
}
.intent-configure { background: #1f6feb33; color: var(--accent); }
.intent-explain { background: #3fb95033; color: var(--green); }
.intent-troubleshoot { background: #f8514933; color: var(--red); }
.intent-define { background: #d2992233; color: var(--yellow); }
.intent-navigate { background: #8b949e33; color: var(--fg2); }
.intent-general { background: #30363d; color: var(--fg2); }

/* Answer card */
.answer-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin: 16px 0;
}
.answer-card h3 { font-size: 18px; margin-bottom: 12px; }
.answer-card .product { color: var(--accent); font-size: 13px; margin-bottom: 8px; }

/* Block */
.block { margin: 12px 0; padding: 16px; background: var(--bg3);
         border-radius: var(--radius); border-left: 3px solid var(--border); }
.block.how_to { border-left-color: var(--accent); }
.block.how_it_works { border-left-color: var(--green); }
.block-type { font-size: 11px; font-weight: 600; text-transform: uppercase;
              color: var(--fg2); margin-bottom: 8px; }
.block-source { font-size: 11px; color: var(--fg3); margin-bottom: 8px; }
.block-content { font-size: 14px; line-height: 1.6; color: var(--fg); }
.block-content code, .block-full code { background: var(--bg); padding: 2px 6px;
                      border-radius: 3px; font-size: 13px; font-family: ui-monospace,
                      SFMono-Regular, Menlo, monospace; }
.block-content a, .block-full a { color: var(--accent); }
.block-content p, .block-full p { margin: 8px 0; }
.block-content h2, .block-full h2,
.block-content h3, .block-full h3 { font-size: 16px; margin: 18px 0 8px;
                      color: var(--fg); padding-bottom: 4px;
                      border-bottom: 1px solid var(--border); }
.block-content h4, .block-full h4 { font-size: 15px; margin: 16px 0 6px; color: var(--fg); }
.block-content h5, .block-full h5,
.block-content h6, .block-full h6 { font-size: 14px; margin: 12px 0 6px;
                      color: var(--fg2); text-transform: uppercase; letter-spacing: .04em; }
.block-content ul, .block-full ul { margin: 8px 0; padding-left: 22px; list-style: disc; }
.block-content ol, .block-full ol { margin: 8px 0; padding-left: 22px; list-style: decimal; }
.block-content li, .block-full li { margin: 4px 0; }
.block-content li > ul, .block-full li > ul,
.block-content li > ol, .block-full li > ol { margin: 4px 0; }
.block-content hr, .block-full hr { border: none; border-top: 1px solid var(--border);
                      margin: 14px 0; }
.block-content blockquote, .block-full blockquote { border-left: 3px solid var(--border);
                      padding: 2px 12px; margin: 8px 0; color: var(--fg2); }
.block-content pre.code-blk { background: var(--bg); border: 1px solid var(--border);
                      border-radius: var(--radius); padding: 12px; overflow-x: auto;
                      font-size: 13px; margin: 10px 0;
                      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.block-content .table-wrap, .block-full .table-wrap { overflow-x: auto; margin: 10px 0; }
.block-content table, .block-full table { border-collapse: collapse; width: 100%;
                      font-size: 13px; }
.block-content th, .block-full th,
.block-content td, .block-full td { border: 1px solid var(--border);
                      padding: 6px 10px; text-align: left; vertical-align: top; }
.block-content th, .block-full th { background: var(--bg); font-weight: 600; }
.block-content tr:nth-child(even) td, .block-full tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
.block-content img, .block-full img { max-width: 100%; height: auto;
                      border: 1px solid var(--border); border-radius: 4px;
                      margin: 8px 0; display: block; }
.block-content .img-line, .block-full .img-line { text-align: center; }
.block-more { display: inline-block; margin-top: 10px; font-size: 13px;
              color: var(--accent); text-decoration: none; cursor: pointer; }
.block-more:hover { text-decoration: underline; }
.block-full { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border);
              font-size: 14px; line-height: 1.6; color: var(--fg); }
.block-full.hidden { display: none; }

/* Related */
.related { margin-top: 12px; font-size: 13px; color: var(--fg2); }
.related a { color: var(--accent); text-decoration: none; }
.related a:hover { text-decoration: underline; }

/* Stats */
.stats { text-align: center; color: var(--fg3); font-size: 12px; margin-top: 20px; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--fg2); }
.loading::after { content: ''; display: inline-block; width: 20px; height: 20px;
                  border: 2px solid var(--border); border-top-color: var(--accent);
                  border-radius: 50%; animation: spin 0.8s linear infinite;
                  margin-left: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Empty state */
.empty { text-align: center; padding: 60px 20px; color: var(--fg2); }
.empty h2 { font-size: 18px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>Unified Search</h1>
        <p>Документация + Решения + CRM — единый поиск</p>
    </header>

    <div class="search-box">
        <input type="text" id="query" placeholder="Задайте вопрос..."
               autofocus autocomplete="off">
        <button onclick="search()">Найти</button>
    </div>

    <div id="results"></div>
    <div id="stats" class="stats"></div>
</div>

<script>
const API = '/api/answer';

function parseHash() {
    const params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    return {
        q: (params.get('q') || '').trim(),
        top: parseInt(params.get('top') || '3', 10) || 3,
        product: params.get('product') || '',
    };
}

let resultsLimit = 3;
let product = '';

function updateHash(q) {
    const p = new URLSearchParams();
    p.set('q', q);
    p.set('top', String(resultsLimit));
    if (product) p.set('product', product);
    const h = '#' + p.toString();
    if (location.hash !== h) {
        history.replaceState(null, '', h);
    }
}

document.getElementById('query').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') search();
});

function search() {
    const q = document.getElementById('query').value.trim();
    if (!q) return;

    updateHash(q);
    document.getElementById('results').innerHTML = '<div class="loading">Поиск</div>';
    document.getElementById('stats').textContent = '';

    fetch(`${API}?q=${encodeURIComponent(q)}&max=${resultsLimit}`)
        .then(r => r.json())
        .then(data => renderResults(data))
        .catch(err => {
            document.getElementById('results').innerHTML =
                `<div class="empty"><h2>Ошибка</h2><p>${err.message}</p></div>`;
        });
}

window.addEventListener('hashchange', () => {
    const h = parseHash();
    resultsLimit = h.top;
    product = h.product;
    document.getElementById('query').value = h.q;
    if (h.q) search();
});

(function init() {
    const h = parseHash();
    resultsLimit = h.top;
    product = h.product;
    if (h.q) {
        document.getElementById('query').value = h.q;
        search();
    }
})();

function renderResults(data) {
    const el = document.getElementById('results');
    const stats = document.getElementById('stats');

    if (data.error) {
        el.innerHTML = `<div class="empty"><h2>Ошибка сервера</h2><p>${escapeHtml(data.error)}</p></div>`;
        return;
    }

    if (!data.answers || data.answers.length === 0) {
        el.innerHTML = '<div class="empty"><h2>Ничего не найдено</h2></div>';
        return;
    }

    let html = '';

    // Intent badge
    html += `<div class="intent-badge intent-${data.intent}">${intentLabel(data.intent)}</div>`;

    // Answers
    for (const answer of data.answers) {
        html += `<div class="answer-card">`;
        html += `<h3>${escapeHtml(answer.title)}</h3>`;
        if (answer.product) {
            html += `<div class="product">${escapeHtml(answer.product)}</div>`;
        }

        // Blocks
        for (const block of answer.blocks) {
            html += `<div class="block ${block.block_type}">`;
            html += `<div class="block-type">${blockLabel(block.block_type)}</div>`;
            html += `<div class="block-source">${sourceLabel(block.source)}`;
            if (block.url) {
                html += ` — <a href="${block.url}" target="_blank">источник</a>`;
            }
            html += `</div>`;
            html += `<div class="block-content">${renderContent(stripLeadingTitle(block.content, block.title), docBase(block.path))}</div>`;
            if (block.source === 'docs' && block.path &&
                (block.content || '').length < 1200) {
                html += `<a href="#" class="block-more" data-path="${escapeHtml(block.path)}">Развернуть полную инструкцию</a>`;
            }
            html += `<div class="block-full hidden"></div>`;
            html += `</div>`;
        }

        // Related
        const related = [];
        if (answer.related_docs && answer.related_docs.length > 0) {
            related.push('Документация: ' + answer.related_docs.map(d =>
                `<a href="${docUrl(d.path)}" target="_blank">${escapeHtml(d.title || d.path)}</a>`
            ).join(', '));
        }
        if (answer.related_solutions && answer.related_solutions.length > 0) {
            related.push('Решения: ' + answer.related_solutions.map(s =>
                `<a href="https://ts-b24-knowledge.search/api/solution?id=${s.id}" target="_blank">${escapeHtml(s.title)}</a>`
            ).join(', '));
        }
        if (answer.related_deals && answer.related_deals.length > 0) {
            related.push('Сделки: ' + answer.related_deals.map(id =>
                `<a href="https://b24.tradesoft.ru/crm/deal/details/${id}/" target="_blank">#${id}</a>`
            ).join(', '));
        }
        if (related.length > 0) {
            html += `<div class="related">${related.join('<br>')}</div>`;
        }

        html += `</div>`;
    }

    el.innerHTML = html;
    bindCardEvents();

    // Stats
    const c = data.counts;
    stats.textContent = `docs: ${c.docs} | solutions: ${c.solutions} | crm: ${c.crm} | ${data.latency_ms}ms`;
}

function bindCardEvents() {
    const el = document.getElementById('results');
    el.querySelectorAll('.answer-card').forEach(card => {
        card.addEventListener('click', (e) => {
            const more = e.target.closest('.block-more');
            if (more) { toggleFull(more); return; }
            if (e.target.closest('a')) return;
            const first = card.querySelector('.block-more');
            if (first) toggleFull(first);
        });
    });
}

function toggleFull(link) {
    const fullDiv = link.closest('.block').querySelector('.block-full');
    if (fullDiv.classList.contains('hidden') && !fullDiv.dataset.loaded) {
        link.textContent = 'Загрузка...';
        fetch(`/api/page?path=${encodeURIComponent(link.dataset.path)}`)
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    fullDiv.innerHTML = `<em>${escapeHtml(data.error)}</em>`;
                } else {
                    fullDiv.innerHTML = renderContent(stripLeadingTitle(data.content, data.title), docBase(data.path || link.dataset.path));
                }
                fullDiv.dataset.loaded = '1';
                fullDiv.classList.remove('hidden');
                link.textContent = 'Свернуть инструкцию';
            })
            .catch(() => { link.textContent = 'Ошибка загрузки'; });
        return;
    }
    const hidden = fullDiv.classList.toggle('hidden');
    link.textContent = hidden ? 'Развернуть полную инструкцию' : 'Свернуть инструкцию';
}

function intentLabel(intent) {
    const labels = {
        configure: 'Настройка', explain: 'Объяснение',
        troubleshoot: 'Устранение', define: 'Определение',
        navigate: 'Навигация', general: 'Общий',
    };
    return labels[intent] || intent;
}

function blockLabel(type) {
    return type === 'how_to' ? 'Как настроить' : 'Как работает';
}

function sourceLabel(source) {
    const labels = { docs: 'Документация', solution: 'Решение', crm: 'CRM' };
    return labels[source] || source;
}

// product-doc.tradesoft.ru: соответствие docs-продукт -> (раздел, подраздел)
const DOC_SECTIONS = {
    'parts-intellect-guide': ['ai', 'ai'],
    'parts-intellect-synch': ['ai', 'synch'],
    'parts-intellect-changes': ['ai', 'changes'],
    'parts-index-rest-api': ['ai', 'rest_api'],
    'delivery_schedule': ['ai', 'delivery_schedule'],
    'diadok': ['ai', 'diadok'],
    'marketplace': ['ai', 'marketplace'],
    'tsd': ['ai', 'tsd'],
    'wazzup': ['ai', 'other'],
    'parts-resource-guide': ['ar', 'ar'],
    'parts-resource-changes': ['ar', 'changes'],
    'parts-resource-rest-api': ['ar', 'rest_api'],
    'seo-guide': ['ar', 'online_guides'],
};

function stripLeadingTitle(text, title) {
    if (!title) return text;
    const t = title.trim();
    const lines = String(text || '').split('\n');
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const h = line.match(/^(#{1,5})\s+(.+)$/);
        if (h && h[2].trim() === t) {
            lines.splice(i, 1);
            return lines.join('\n');
        }
        break;
    }
    return text;
}

function renderContent(text, base) {
    if (!text) return '<em>нет контента</em>';
    const lines = escapeHtml(text).split('\n');
    let html = '';
    let i = 0;
    const n = lines.length;
    while (i < n) {
        const line = lines[i];
        const t = line.trim();
        if (!t) { i++; continue; }

        // Блок кода
        if (/^```/.test(t)) {
            const buf = [];
            i++;
            while (i < n && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }
            i++;
            html += `<pre class="code-blk">${buf.join('\n')}</pre>`;
            continue;
        }

        // Заголовки: # — h2, ## — h3, ### — h4, #### — h5, ##### — h6
        const h = t.match(/^(#{1,5})\s+(.+)$/);
        if (h) {
            const lvl = Math.min(1 + h[1].length, 6);
            html += `<h${lvl}>${inline(h[2].trim(), base)}</h${lvl}>`;
            i++; continue;
        }

        // Горизонтальная линия
        if (/^(-{3,}|\*{3,})$/.test(t)) { html += '<hr>'; i++; continue; }

        // Списки
        if (/^\s*[-*] |^\s*\d+[.)] /.test(line)) {
            const r = renderList(lines, i, base);
            html += r.html;
            i = r.next;
            continue;
        }

        // Таблица
        if (t.indexOf('|') !== -1) {
            const tb = renderTable(lines, i, base);
            if (tb) { html += tb.html; i = tb.next; continue; }
        }

        // Строка-картинка
        const aimg = t.match(/^!\[([^\]]*)\]\(([^)]*)\)$/);
        if (aimg) { html += `<p class="img-line">${imgHtml(aimg[1], aimg[2], base)}</p>`; i++; continue; }

        html += `<p>${inline(t, base)}</p>`;
        i++;
    }
    return html;
}

function renderList(lines, start, base) {
    const items = [];
    let i = start;
    while (i < lines.length) {
        const m = lines[i].match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
        if (!m) break;
        items.push({ indent: m[1].length, ul: (m[2] === '-' || m[2] === '*'), text: m[3] });
        i++;
    }
    let html = '';
    const stack = [{ indent: -1, ul: true }];
    for (const it of items) {
        while (stack.length > 1 && stack[stack.length - 1].indent > it.indent) {
            html += `</${stack.pop().ul ? 'ul' : 'ol'}>`;
        }
        if (stack[stack.length - 1].indent < it.indent) {
            stack.push({ indent: it.indent, ul: it.ul });
            html += `<${it.ul ? 'ul' : 'ol'}>`;
        }
        html += `<li>${inline(it.text, base)}</li>`;
    }
    while (stack.length > 1) { html += `</${stack.pop().ul ? 'ul' : 'ol'}>`; }
    return { html, next: i };
}

function renderTable(lines, start, base) {
    const split = (t) => t.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    let rows = [];
    let i = start;
    while (i < lines.length) {
        const t = lines[i].trim();
        if (!t || t.indexOf('|') === -1) break;
        if (/^[-: |]+$/.test(t)) {
            rows.push({ cells: split(t), sep: true });
        } else {
            rows.push({ cells: split(t), sep: false });
        }
        i++;
    }
    if (rows.length < 2) return null;
    const head = rows.find(r => !r.sep);
    if (!head) return null;
    let html = '<div class="table-wrap"><table>';
    html += '<thead><tr>' + head.cells.map(c => `<th>${inline(c || '', base)}</th>`).join('') + '</tr></thead>';
    html += '<tbody>';
    for (const r of rows) {
        if (r === head || r.sep) continue;
        html += '<tr>' + r.cells.map(c => `<td>${inline(c || '', base)}</td>`).join('') + '</tr>';
    }
    html += '</tbody></table></div>';
    return { html, next: i };
}

function inline(text, base) {
    // Сначала защищаем инлайн-код от форматирования внутри
    const codes = [];
    text = text.replace(/`([^`]*)`/g, (m, code) => {
        codes.push(code);
        return '\uE000' + (codes.length - 1) + '\uE001';
    });
    text = text.replace(/(?:!\[([^\]]*)\]\(([^)]*)\)|\[([^\]]*)\]\(([^)]*)\))/g,
        (m, imgAlt, imgSrc, linkText, linkUrl) => {
            if (imgSrc) return imgHtml(imgAlt, imgSrc, base);
            return linkHtml(linkText, linkUrl);
        });
    if (codes.length) {
        text = text.replace(/\uE000(\d+)\uE001/g, (m, idx) => `<code>${codes[+idx]}</code>`);
    }
    return text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
               .replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

function linkHtml(text, url) {
    if (!url) return escapeHtml(text || '');
    const safe = url.replace(/javascript:/gi, '');
    if (/^https?:\/\//.test(safe) || safe.startsWith('/')) {
        return `<a href="${safe}" target="_blank" rel="noopener">${escapeHtml(text || url)}</a>`;
    }
    return escapeHtml(text || url);
}

function imgHtml(alt, src, base) {
    let full = src;
    if (!/^https?:\/\//.test(src)) {
        // Картинки статей лежат рядом со страницей (имя файла без подпапки)
        full = (base || '') + src.split('/').pop();
    }
    return `<a class="img" href="${full}" target="_blank" rel="noopener">` +
           `<img src="${full}" alt="${escapeHtml(alt || '')}" loading="lazy"></a>`;
}

function docUrl(path) {
    const i = String(path || '').indexOf('__');
    if (i < 1) return '#';
    const product = path.slice(0, i);
    const page = path.slice(i + 2);
    const sec = DOC_SECTIONS[product];
    const stem = page.endsWith('.md') ? page.slice(0, -3) : page;
    const base = sec
        ? `https://product-doc.tradesoft.ru/${sec[0]}/${sec[1]}`
        : `https://product-doc.tradesoft.ru/${product}/${product}`;
    return `${base}/${stem}`;
}

function docBase(path) {
    return docUrl(path).replace(/[^/]*$/, '');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
